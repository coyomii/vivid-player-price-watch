name: Vivid Player 折扣提醒

on:
  schedule:
    # Experimental compensation for observed scheduler delays (2026-11-09).
    # Target checks: 08:00 / 20:00 Beijing; actual timing is not guaranteed.
    # Advance by the observed per-slot median: 223 / 325 minutes.
    - cron: '17 4 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '35 14 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
    inputs:
      test_notification:
        description: '发送一条明确标注的 GitHub Issue 测试通知'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: vivid-player-price-watch
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check price and notify only on a new deal
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_NOTIFICATION: ${{ inputs.test_notification && '1' || '0' }}
        run: python monitor.py
